services:
  formrelay:
    image: registry.triboulin.fr/formrelay:latest
    pull_policy: always
    container_name: formrelay
    restart: unless-stopped
    ports:
      - "18078:8080"
    volumes:
      - ./data:/app/data
    environment:
      PORT: "8080"
      DATABASE_URL: "/app/data/formrelay.db"
      ADMIN_USER: "admin"
      ADMIN_PASS: "changeme"
      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_USER: "smtp-user"
      SMTP_PASS: "smtp-pass"
      FROM_EMAIL: "noreply@example.com"
      FROM_NAME: "FormRelay"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s